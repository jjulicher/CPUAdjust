<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="chassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="bevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="55%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="ihs" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="45%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="pcb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#134e4a"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="arcGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowAmber" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Squircle Chassis -->
  <rect x="24" y="24" width="464" height="464" rx="96" ry="96" fill="url(#chassis)" stroke="url(#bevel)" stroke-width="10"/>

  <!-- Inner AM5 Substrate PCB -->
  <rect x="78" y="78" width="356" height="356" rx="28" ry="28" fill="url(#pcb)" stroke="#0f172a" stroke-width="8"/>

  <!-- Pin-1 Gold Corner Triangle -->
  <polygon points="92,92 120,92 92,120" fill="#eab308"/>

  <!-- Gold SMD Capacitor Pads on AM5 Substrate -->
  <g fill="#ca8a04" opacity="0.88">
    <!-- Left top & bottom banks -->
    <rect x="94" y="164" width="8" height="6" rx="2"/><rect x="106" y="164" width="8" height="6" rx="2"/>
    <rect x="94" y="176" width="8" height="6" rx="2"/><rect x="106" y="176" width="8" height="6" rx="2"/>
    <rect x="94" y="188" width="8" height="6" rx="2"/><rect x="106" y="188" width="8" height="6" rx="2"/>
    <rect x="94" y="318" width="8" height="6" rx="2"/><rect x="106" y="318" width="8" height="6" rx="2"/>
    <rect x="94" y="330" width="8" height="6" rx="2"/><rect x="106" y="330" width="8" height="6" rx="2"/>
    <rect x="94" y="342" width="8" height="6" rx="2"/><rect x="106" y="342" width="8" height="6" rx="2"/>
    <!-- Right top & bottom banks -->
    <rect x="398" y="164" width="8" height="6" rx="2"/><rect x="410" y="164" width="8" height="6" rx="2"/>
    <rect x="398" y="176" width="8" height="6" rx="2"/><rect x="410" y="176" width="8" height="6" rx="2"/>
    <rect x="398" y="188" width="8" height="6" rx="2"/><rect x="410" y="188" width="8" height="6" rx="2"/>
    <rect x="398" y="318" width="8" height="6" rx="2"/><rect x="410" y="318" width="8" height="6" rx="2"/>
    <rect x="398" y="330" width="8" height="6" rx="2"/><rect x="410" y="330" width="8" height="6" rx="2"/>
    <rect x="398" y="342" width="8" height="6" rx="2"/><rect x="410" y="342" width="8" height="6" rx="2"/>
  </g>

  <!-- Stylized AM5 Ryzen Octagonal Notched Heatspreader (IHS) -->
  <path d="
    M 140 96
    L 172 96 L 172 132 L 234 132 L 234 96 L 278 96 L 278 132 L 340 132 L 340 96 L 372 96
    A 28 28 0 0 1 400 124
    L 400 154 L 368 154 L 368 226 L 400 226 L 400 286 L 368 286 L 368 358 L 400 358 L 400 388
    A 28 28 0 0 1 372 416
    L 340 416 L 340 380 L 278 380 L 278 416 L 234 416 L 234 380 L 172 380 L 172 416 L 140 416
    A 28 28 0 0 1 112 388
    L 112 358 L 144 358 L 144 286 L 112 286 L 112 226 L 144 226 L 144 154 L 112 154 L 112 124
    A 28 28 0 0 1 140 96 Z"
    fill="url(#ihs)" stroke="#cbd5e1" stroke-width="4" stroke-linejoin="round"/>

  <!-- Inner Dial Recess -->
  <circle cx="256" cy="256" r="118" fill="#1e293b" opacity="0.65"/>

  <!-- Telemetry Gauge Arc (Cyan to Amber) -->
  <path d="M 196 356 A 116 116 0 1 1 316 356"
    fill="none" stroke="url(#arcGrad)" stroke-width="6" stroke-linecap="round" filter="url(#glowCyan)"/>

  <!-- Amber Baseline Voltage Wave -->
  <path d="M 176 256 C 204 202, 232 202, 256 256 C 280 310, 308 310, 336 256"
    fill="none" stroke="#f97316" stroke-width="6.5" stroke-linecap="round" filter="url(#glowAmber)"/>

  <!-- Cyan Curve Optimizer Undervolt Wave -->
  <path d="M 176 256 C 204 158, 230 158, 256 256 C 282 354, 308 354, 336 256"
    fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" filter="url(#glowCyan)"/>
</svg>
